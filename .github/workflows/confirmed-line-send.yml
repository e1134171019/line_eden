name: Send confirmed scholarship links

on:
  push:
    branches:
      - main
    paths:
      - ".github/confirmed-line-trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scholarship-confirmed-line-send
  cancel-in-progress: false

jobs:
  send-confirmed-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      TZ: Asia/Taipei

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Validate LINE secrets
        shell: bash
        run: |
          python - <<'PY'
          import os

          required = ["LINE_CHANNEL_ACCESS_TOKEN", "LINE_USER_ID"]
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              raise SystemExit(f"缺少 GitHub Actions Secrets：{', '.join(missing)}")
          print("LINE Secrets 檢查完成。")
          PY

      - name: Send confirmed scholarship links
        run: python -m src.automation.send_confirmed_line_links
