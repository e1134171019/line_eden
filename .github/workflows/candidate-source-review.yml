name: Candidate scholarship source review

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/catalogs/additional_source_catalog.py"
      - "src/collectors/additional_scholarship_source_collector.py"
      - "src/automation/candidate_source_review.py"
      - ".github/workflows/candidate-source-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-source-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Taipei

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Review candidate sources
        run: python -m src.automation.candidate_source_review
