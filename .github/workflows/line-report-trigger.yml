name: LINE scholarship audit report

on:
  push:
    branches:
      - main
    paths:
      - ".github/line-report-trigger"

permissions:
  contents: read
  actions: read

concurrency:
  group: scholarship-cloud-production
  cancel-in-progress: false

jobs:
  line-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      STUDENT_PROFILE_B64: ${{ secrets.STUDENT_PROFILE_B64 }}
      STATE_PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Taipei

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          python - <<'PY'
          import os

          required = (
              "LINE_CHANNEL_ACCESS_TOKEN",
              "LINE_USER_ID",
              "GEMINI_API_KEY",
              "STUDENT_PROFILE_B64",
              "STATE_PASSPHRASE",
          )
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              raise SystemExit(f"缺少 GitHub Actions Secrets：{', '.join(missing)}")
          print("LINE 稽核報告 Secrets 檢查完成。")
          PY

      - name: Find latest cloud state
        id: latest_state
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=scholarship-agent-state&per_page=100" \
              --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main")] | sort_by(.created_at) | last | .workflow_run.id'
          )"
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "找不到雲端狀態；請先執行 initialize。" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "將從 workflow run $run_id 還原狀態。"

      - name: Download encrypted cloud state
        uses: actions/download-artifact@v5
        with:
          name: scholarship-agent-state
          path: cloud-state
          repository: ${{ github.repository }}
          run-id: ${{ steps.latest_state.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decrypt cloud state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          test -f cloud-state/scholarship-state.tar.gz.gpg
          printf '%s' "$STATE_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 \
              --output cloud-state/scholarship-state.tar.gz \
              --decrypt cloud-state/scholarship-state.tar.gz.gpg
          tar -xzf cloud-state/scholarship-state.tar.gz
          test -f data/scholarships.db
          rm -f cloud-state/scholarship-state.tar.gz

      - name: Build private profile file
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          raw = base64.b64decode(os.environ["STUDENT_PROFILE_B64"], validate=True)
          json.loads(raw.decode("utf-8"))
          Path("profile.json").write_bytes(raw)
          print("profile.json 已由 GitHub Secret 建立。")
          PY

      - name: Send LINE audit report
        id: report
        shell: bash
        run: |
          set +e
          python -m src.automation.line_audit_bundle > line-report.log 2>&1
          exit_code=$?
          set -e
          cat line-report.log
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Encrypt updated cloud state
        id: state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f data/scholarships.db ]]; then
            echo "沒有可保存的 scholarships.db。"
            echo "has_state=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p cloud-state
          state_files=(data/scholarships.db)
          if [[ -f data/gemini_cache.db ]]; then
            state_files+=(data/gemini_cache.db)
          fi
          tar -czf cloud-state/scholarship-state.tar.gz "${state_files[@]}"
          printf '%s' "$STATE_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 \
              --output cloud-state/scholarship-state.tar.gz.gpg \
              cloud-state/scholarship-state.tar.gz
          rm -f cloud-state/scholarship-state.tar.gz
          echo "has_state=true" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted cloud state
        if: always() && steps.state.outputs.has_state == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: scholarship-agent-state
          path: cloud-state/scholarship-state.tar.gz.gpg
          if-no-files-found: error
          retention-days: 90

      - name: Upload report log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: line-report-log-${{ github.run_id }}
          path: line-report.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload structured shadow audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: line-structured-shadow-${{ github.run_id }}
          path: |
            artifacts/structured-shadow-audit.csv
            artifacts/structured-shadow-audit.json
            artifacts/source-health.json
            artifacts/pipeline-rejections.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Clear private profile
        if: always()
        shell: bash
        run: rm -f profile.json

      - name: Return report exit code
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.report.outputs.exit_code }}"
          if [[ -z "$exit_code" ]]; then
            echo "LINE 稽核報告未產生 exit code。" >&2
            exit 1
          fi
          exit "$exit_code"
