name: Private Auden eligibility diagnostic

on:
  push:
    branches:
      - agent/add-multi-channel-notifications
    paths:
      - ".github/auden-diagnostic-trigger"

permissions:
  contents: read
  actions: read

jobs:
  diagnose-auden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      STATE_PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$LINE_CHANNEL_ACCESS_TOKEN"
          test -n "$LINE_USER_ID"
          test -n "$STATE_PASSPHRASE"

      - name: Download evaluated cloud state
        uses: actions/download-artifact@v5
        with:
          name: scholarship-agent-state
          path: cloud-state
          repository: ${{ github.repository }}
          run-id: 30696603036
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decrypt evaluated cloud state
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$STATE_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 \
              --output cloud-state/scholarship-state.tar.gz \
              --decrypt cloud-state/scholarship-state.tar.gz.gpg
          tar -xzf cloud-state/scholarship-state.tar.gz
          test -f data/scholarships.db

      - name: Send private Auden result to LINE
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sqlite3
          import urllib.request

          target_url = "https://www.auden.com.tw/2026scholarship/"
          with sqlite3.connect("data/scholarships.db") as conn:
              row = conn.execute(
                  """
                  SELECT title, published_date, notice_kind,
                         COALESCE(eligibility_status, 'not_evaluated'),
                         COALESCE(eligibility_reason, '尚未產生原因'),
                         CASE WHEN notified_at IS NULL THEN '尚未標記通知' ELSE '已標記通知' END
                  FROM scholarships
                  WHERE source_url = ?
                     OR source = 'tun-program-auden-university-talent'
                  ORDER BY CASE WHEN source_url = ? THEN 0 ELSE 1 END, id DESC
                  LIMIT 1
                  """,
                  [target_url, target_url],
              ).fetchone()
          if row is None:
              raise SystemExit("Auden 2026 公告不存在於本次加密狀態")
          title, published, notice_kind, status, reason, delivery = row
          message = (
              "Auden 2026 單筆私密診斷\n"
              f"標題：{title}\n"
              f"刊登日：{published}\n"
              f"公告分類：{notice_kind}\n"
              f"資格狀態：{status}\n"
              f"通知狀態：{delivery}\n"
              f"判定原因：{reason}\n"
              f"官方頁：{target_url}"
          )
          payload = json.dumps(
              {"to": os.environ["LINE_USER_ID"], "messages": [{"type": "text", "text": message}]},
              ensure_ascii=False,
          ).encode("utf-8")
          request = urllib.request.Request(
              "https://api.line.me/v2/bot/message/push",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['LINE_CHANNEL_ACCESS_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              if response.status != 200:
                  raise RuntimeError("LINE 私密診斷傳送失敗")
          print("Auden 私密診斷已送出；內容未寫入公開 log。")
          PY

      - name: Remove decrypted state
        if: always()
        shell: bash
        run: rm -rf data cloud-state
