name: Live source contract

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/live-source-contract.yml"
      - "config.py"
      - "requirements.txt"
      - "src/automation/live_source_contract.py"
      - "src/catalogs/**"
      - "src/collectors/**"
      - "src/matchers/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-source-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Execute 38-source live contract
        id: contract
        shell: bash
        run: |
          set +e
          python -m src.automation.live_source_contract | tee live-source-contract.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish live contract summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/live-source-contract.md ]]; then
            cat artifacts/live-source-contract.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Live source contract 未產生報告。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload live contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-source-contract-${{ github.run_id }}
          path: |
            artifacts/live-source-contract.json
            artifacts/live-source-contract.md
            live-source-contract.log
          if-no-files-found: error
          retention-days: 30

      - name: Enforce live contract result
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.contract.outputs.exit_code }}"
          if [[ -z "$exit_code" ]]; then
            echo "Live source contract 未產生 exit code。" >&2
            exit 1
          fi
          exit "$exit_code"
