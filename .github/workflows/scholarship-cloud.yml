name: Scholarship cloud schedule

on:
  push:
    branches:
      - main
    paths:
      - ".github/report-trigger"
  schedule:
    # GitHub cron 使用 UTC；23:30 UTC = 台灣翌日 07:30。
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "執行模式；第一次先選 initialize"
        required: true
        default: daily
        type: choice
        options:
          - initialize
          - daily
          - run
          - report
          - dry-run
          - test-line

permissions:
  contents: read
  actions: read

concurrency:
  group: scholarship-cloud-production
  cancel-in-progress: false

jobs:
  scholarship-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPERATION: ${{ github.event_name == 'schedule' && 'daily' || github.event_name == 'push' && 'daily' || inputs.operation }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      STUDENT_PROFILE_B64: ${{ secrets.STUDENT_PROFILE_B64 }}
      STATE_PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Taipei

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          python - <<'PY'
          import os

          operation = os.environ["OPERATION"]
          required = []
          if operation in {"initialize", "daily", "run", "dry-run"}:
              required.append("STATE_PASSPHRASE")
          if operation in {"daily", "run", "report"}:
              required += ["LINE_CHANNEL_ACCESS_TOKEN", "LINE_USER_ID"]
          if operation in {"daily", "run", "report", "dry-run"}:
              required += ["GEMINI_API_KEY", "STUDENT_PROFILE_B64"]
          elif operation == "test-line":
              required += ["LINE_CHANNEL_ACCESS_TOKEN", "LINE_USER_ID"]
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              raise SystemExit(f"缺少 GitHub Actions Secrets：{', '.join(missing)}")
          print(f"Secrets 檢查完成，operation={operation}")
          PY

      - name: Find latest cloud state
        id: latest_state
        if: env.OPERATION == 'daily' || env.OPERATION == 'run' || env.OPERATION == 'dry-run'
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=scholarship-agent-state&per_page=100" \
              --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main")] | sort_by(.created_at) | last | .workflow_run.id'
          )"
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "找不到雲端狀態；請先手動執行 initialize。" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "將從 workflow run $run_id 還原狀態。"

      - name: Download encrypted cloud state
        if: env.OPERATION == 'daily' || env.OPERATION == 'run' || env.OPERATION == 'dry-run'
        uses: actions/download-artifact@v5
        with:
          name: scholarship-agent-state
          path: cloud-state
          repository: ${{ github.repository }}
          run-id: ${{ steps.latest_state.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decrypt cloud state
        if: env.OPERATION == 'daily' || env.OPERATION == 'run' || env.OPERATION == 'dry-run'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          test -f cloud-state/scholarship-state.tar.gz.gpg
          printf '%s' "$STATE_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 \
              --output cloud-state/scholarship-state.tar.gz \
              --decrypt cloud-state/scholarship-state.tar.gz.gpg
          tar -xzf cloud-state/scholarship-state.tar.gz
          test -f data/scholarships.db
          rm -f cloud-state/scholarship-state.tar.gz

      - name: Build private profile file
        if: env.OPERATION == 'daily' || env.OPERATION == 'run' || env.OPERATION == 'report' || env.OPERATION == 'dry-run'
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          raw = base64.b64decode(os.environ["STUDENT_PROFILE_B64"], validate=True)
          json.loads(raw.decode("utf-8"))
          Path("profile.json").write_bytes(raw)
          print("profile.json 已由 GitHub Secret 建立。")
          PY

      - name: Execute Scholarship Agent
        id: agent
        shell: bash
        run: |
          set +e
          {
            case "$OPERATION" in
              initialize)
                python main.py --initialize-baseline
                ;;
              daily)
                python -m src.automation.daily_line_digest
                ;;
              run)
                python main.py --use-gemini
                ;;
              report)
                python -m src.automation.line_audit_report
                ;;
              dry-run)
                python main.py --dry-run --use-gemini
                ;;
              test-line)
                python -c 'from config import HTTP_TIMEOUT_SECONDS, LINE_API_URL, LINE_CHANNEL_ACCESS_TOKEN, LINE_USER_ID, TEST_MESSAGE, validate_settings; from src.notifiers.line_notifier import send_text_message; validate_settings(); send_text_message(api_url=LINE_API_URL, channel_access_token=LINE_CHANNEL_ACCESS_TOKEN, user_id=LINE_USER_ID, text="GitHub Actions 雲端測試：" + TEST_MESSAGE, timeout_seconds=HTTP_TIMEOUT_SECONDS); print("LINE 雲端測試通知已送出")'
                ;;
              *)
                echo "不支援的 operation：$OPERATION" >&2
                exit 2
                ;;
            esac
          } > cloud-run.log 2>&1
          exit_code=$?
          set -e
          cat cloud-run.log
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Encrypt updated cloud state
        id: state
        if: always() && (env.OPERATION == 'initialize' || env.OPERATION == 'daily' || env.OPERATION == 'run' || env.OPERATION == 'dry-run')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f data/scholarships.db ]]; then
            echo "沒有可保存的 scholarships.db。"
            echo "has_state=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p cloud-state
          state_files=(data/scholarships.db)
          if [[ -f data/gemini_cache.db ]]; then
            state_files+=(data/gemini_cache.db)
          fi
          tar -czf cloud-state/scholarship-state.tar.gz "${state_files[@]}"
          printf '%s' "$STATE_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 \
              --output cloud-state/scholarship-state.tar.gz.gpg \
              cloud-state/scholarship-state.tar.gz
          rm -f cloud-state/scholarship-state.tar.gz
          echo "has_state=true" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted cloud state
        if: always() && steps.state.outputs.has_state == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: scholarship-agent-state
          path: cloud-state/scholarship-state.tar.gz.gpg
          if-no-files-found: error
          retention-days: 90

      - name: Upload execution log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scholarship-agent-log-${{ github.run_id }}
          path: cloud-run.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Scholarship Agent"
            echo ""
            echo "- 台灣排程時間：每日 07:30"
            echo "- 執行模式：\`$OPERATION\`"
            echo "- 每日 LINE 摘要：\`${{ env.OPERATION == 'daily' && '固定傳送' || '依模式決定' }}\`"
            echo "- Agent exit code：\`${{ steps.agent.outputs.exit_code || '未執行' }}\`"
            echo "- 雲端狀態已保存：\`${{ steps.state.outputs.has_state || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Return agent exit code
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.agent.outputs.exit_code }}"
          if [[ -z "$exit_code" ]]; then
            echo "Scholarship Agent 未產生 exit code。" >&2
            exit 1
          fi
          exit "$exit_code"
