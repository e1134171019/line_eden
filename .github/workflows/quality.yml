name: Quality checks

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Pyright
        shell: bash
        run: |
          set -o pipefail
          python -m pyright 2>&1 | tee "pyright-${{ matrix.python-version }}.log"

      - name: Upload failed Pyright log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pyright-log-${{ matrix.python-version }}
          path: pyright-${{ matrix.python-version }}.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -x -q --tb=short \
            -W error::ResourceWarning \
            --cov=src --cov-fail-under=0 --cov-report=term-missing \
            2>&1 | tee "pytest-${{ matrix.python-version }}.log"

      - name: Enforce coverage threshold
        run: python -m coverage report --fail-under=85

      - name: Upload failed pytest log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-log-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.log
          if-no-files-found: ignore
          retention-days: 7
