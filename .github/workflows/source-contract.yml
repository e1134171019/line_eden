name: Scholarship source contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/catalogs/**"
      - "src/collectors/**"
      - "src/matchers/**"
      - "src/automation/candidate_source_review.py"
      - "src/automation/source_contract_report.py"
      - "src/automation/source_health_artifact.py"
      - ".github/workflows/source-contract.yml"
  workflow_dispatch:
  schedule:
    - cron: "20 23 * * 0"

permissions:
  contents: read

concurrency:
  group: scholarship-source-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Taipei

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Review newly added sources
        if: github.event_name == 'pull_request'
        env:
          SOURCE_REVIEW_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python -m src.automation.candidate_source_review

      - name: Run live source contract
        id: contract
        shell: bash
        run: |
          set +e
          python -m src.automation.source_contract_report > source-contract.log 2>&1
          exit_code=$?
          set -e
          cat source-contract.log
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Upload source health
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-health-${{ github.run_id }}
          path: |
            artifacts/source-health.json
            source-contract.log
          if-no-files-found: error
          retention-days: 30

      - name: Return contract exit code
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.contract.outputs.exit_code }}"
          if [[ -z "$exit_code" ]]; then
            echo "來源契約未產生 exit code。" >&2
            exit 1
          fi
          exit "$exit_code"
