name: Source contract checks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 6"

permissions:
  contents: read

concurrency:
  group: scholarship-source-contract
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Taipei

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Run full source contract
        id: contract
        shell: bash
        run: |
          set +e
          python -m src.automation.source_contract_report > source-contract.log 2>&1
          exit_code=$?
          set -e
          cat source-contract.log
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Upload source contract artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-contract-${{ github.run_id }}
          path: |
            source-contract.log
            artifacts/source-health.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Return contract exit code
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.contract.outputs.exit_code }}"
          if [[ -z "$exit_code" ]]; then
            echo "來源契約未產生 exit code。" >&2
            exit 1
          fi
          exit "$exit_code"
